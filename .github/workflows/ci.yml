name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      # 静的検査・テスト用のダミー認証情報（本番とは無関係）。
      ML_SECRET_KEY: ci-test-secret-key-32chars-minimum!!
      ML_PASSWORD_HASH: "$2b$12$RHwx7zPHA19vql19AlaaX.0KKZj4BK7c4ZwtpB7OMXQqnUkVFzJOO"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: backend/requirements-ci.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-ci.txt
      - name: Lint (ruff)
        run: python -m ruff check backend
      - name: Format check (black)
        run: python -m black --check backend
      - name: Type check (mypy)
        run: python -m mypy backend
      - name: Security scan (bandit)
        run: python -m bandit -r backend --exclude backend/tests,backend/alembic -q
      - name: Dependency vulnerability scan (pip-audit)
        run: pip install pip-audit && pip-audit -r backend/requirements-ci.txt
      - name: Run tests (with coverage threshold)
        run: python -m pytest --tb=short -q --cov=backend --cov-report=term-missing --cov-fail-under=80
      - name: Export OpenAPI schema
        run: python scripts/export_openapi.py
      - name: Upload OpenAPI schema
        uses: actions/upload-artifact@v4
        with:
          name: openapi-schema-${{ matrix.python-version }}
          path: docs/openapi.json

  frontend:
    name: Frontend (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint
      - name: Type check (tsc)
        working-directory: frontend
        run: npx tsc --noEmit --pretty false
      - name: Dependency vulnerability scan (npm audit)
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Run tests (with coverage threshold)
        working-directory: frontend
        env:
          TZ: UTC
        run: npm run test:coverage
      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    env:
      ML_SECRET_KEY: e2e-ci-dummy-secret-key-32chars!!
      ML_PASSWORD_HASH: "$2b$12$RHwx7zPHA19vql19AlaaX.0KKZj4BK7c4ZwtpB7OMXQqnUkVFzJOO"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements-ci.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements-ci.txt
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start backend
        run: |
          nohup python -m uvicorn backend.main:app --host 127.0.0.1 --port 8002 > backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8002/openapi.json > /dev/null; then echo "backend up"; exit 0; fi
            sleep 2
          done
          echo "backend failed to start"; cat backend.log; exit 1
      - name: Run Playwright tests
        working-directory: frontend
        env:
          CI: "true"
          BACKEND_PROXY_TARGET: http://127.0.0.1:8002
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
